on:
  workflow_dispatch:
  push:
    branches:
      - mistress

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - run: python3 tap.py
